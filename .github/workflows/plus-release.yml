name: Hydra Plus release

# Builds the Linux packages of Hydra Plus and publishes them as a GitHub
# release. electron-updater in installed copies reads latest-linux.yml from
# the newest release, so every tag here is an update for AppImage users.
on:
  push:
    tags:
      - "v*-plus.*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  linux:
    # Pinned: ubuntu-latest moves to a new release without notice.
    runs-on: ubuntu-24.04

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.21.0
          cache: "yarn"

      # The Linux build also cross-compiles a small Windows helper that runs
      # under Wine for Epic games.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: native/hydra-native -> target
          cache-bin: false

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config \
            curl zip unzip tar autoconf automake libtool libarchive-tools \
            gcc-mingw-w64-x86-64

      - name: Install dependencies
        run: yarn --frozen-lockfile

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "v${version}" = "${GITHUB_REF_NAME}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          }

      # Publishing is left to the next step, so electron-builder never
      # creates a release of its own.
      - name: Build Linux packages
        run: |
          yarn build:native
          yarn electron-vite build
          yarn electron-builder --linux --publish never
        env:
          # Hydra's public production endpoints. The launcher subdomain stays
          # empty so the bundled renderer, with the fork's features, is used.
          MAIN_VITE_API_URL: https://hydra-api-us-east-1.losbroxas.org
          MAIN_VITE_AUTH_URL: https://auth.hydra.losbroxas.org
          MAIN_VITE_CHECKOUT_URL: https://checkout.hydralauncher.gg
          MAIN_VITE_LAUNCHER_SUBDOMAIN: ""
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Unsigned for now; Firefox installs it temporarily from about:debugging,
      # Chromium-based browsers through "Load unpacked".
      - name: Package Steam add-on
        run: |
          version="$(node -p 'require("./extensions/steam/manifest.json").version')"
          (cd extensions/steam && zip -r "../../dist/hydra-plus-steam-addon-${version}.zip" . -x .eslintrc.cjs README.md)

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: Hydra Plus ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.AppImage
            dist/*.pacman
            dist/hydra-plus-steam-addon-*.zip
            dist/latest-linux.yml
            dist/*.blockmap
